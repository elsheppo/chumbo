[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "chumbo"
version = "0.1.0"
description = "Inspect and diagnose deployed Chumbo MCP endpoints from Python."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shep Bryan" }]
keywords = ["chumbo", "mcp", "model-context-protocol", "supabase"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Source = "https://github.com/elsheppo/chumbo"
Issues = "https://github.com/elsheppo/chumbo/issues"

[project.scripts]
chumbo-inspect = "chumbo.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.sdist]
include = ["src/chumbo", "tests", "README.md", "LICENSE", "pyproject.toml", "uv.lock"]
exclude = [".gitignore"]

[tool.hatch.build.targets.wheel]
packages = ["src/chumbo"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
