name: Starters

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.2.3
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:starters

  integration:
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.2.3
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - run: pnpm install --frozen-lockfile
      # Uses the runner's preinstalled Google Chrome through playwright-core.
      - run: pnpm test:starters:integration --screenshots starter-screenshots
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: starter-screenshots
          path: starter-screenshots
          if-no-files-found: ignore
