name: Living reference project

on:
  pull_request:
  push:
    branches: [main]

jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: supabase/setup-cli@v1
        with:
          version: 2.114.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm reference:check
