<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Authorize Chumbo</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #111311;
        color: #f4f5f2;
      }
      main {
        width: min(440px, calc(100vw - 32px));
        padding: 32px;
        border: 1px solid #343834;
        border-radius: 18px;
        background: #191c19;
        box-shadow: 0 22px 70px rgba(0, 0, 0, 0.35);
      }
      .eyebrow {
        margin: 0 0 8px;
        color: #92b99c;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font-size: 28px;
        letter-spacing: -0.03em;
      }
      p {
        color: #b8beb8;
        line-height: 1.55;
      }
      .actions {
        display: flex;
        gap: 10px;
        margin-top: 24px;
      }
      button {
        flex: 1;
        border: 1px solid #3b403b;
        border-radius: 10px;
        padding: 11px 14px;
        background: #262a26;
        color: inherit;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button.primary {
        border-color: #6aa578;
        background: #6aa578;
        color: #0d160f;
      }
      button:disabled {
        cursor: wait;
        opacity: 0.55;
      }
      .details {
        margin: 22px 0 0;
        padding: 16px;
        border-radius: 12px;
        background: #111411;
      }
      .details strong {
        display: block;
        margin-bottom: 6px;
      }
      .scopes {
        margin: 12px 0 0;
        padding-left: 20px;
        color: #b8beb8;
      }
      .error {
        min-height: 22px;
        margin: 14px 0 0;
        color: #f0a2a2;
        font-size: 14px;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Chumbo</p>
      <section id="loading">
        <h1>Checking authorization</h1>
        <p>Loading the connection request.</p>
      </section>
      <section id="signin" hidden>
        <h1>Sign in first</h1>
        <p>
          This consent page does not collect credentials. Sign in through the
          application's existing authentication flow, then return to this
          request.
        </p>
        <button id="retry" type="button">Check again</button>
      </section>
      <section id="consent" hidden>
        <h1>Approve this connection?</h1>
        <div class="details">
          <strong id="client-name"></strong>
          <span>is requesting access as your signed-in user.</span>
          <ul id="scopes" class="scopes"></ul>
        </div>
        <div class="actions">
          <button id="deny" type="button">Deny</button>
          <button id="approve" class="primary" type="button">Approve</button>
        </div>
      </section>
      <p id="error" class="error" role="alert"></p>
    </main>
    <script type="module">
      import { createClient } from "https://esm.sh/@supabase/supabase-js@2.105.4";

      const supabase = createClient(
        "__SUPABASE_PROJECT_URL__",
        "__SUPABASE_PUBLISHABLE_KEY__",
      );
      const authorizationId = new URL(location.href).searchParams.get(
        "authorization_id",
      );
      const loading = document.querySelector("#loading");
      const signin = document.querySelector("#signin");
      const consent = document.querySelector("#consent");
      const errorNode = document.querySelector("#error");
      const setError = (message = "") => {
        errorNode.textContent = message;
      };
      const show = (section) => {
        for (const node of [loading, signin, consent])
          node.hidden = node !== section;
      };

      async function loadAuthorization() {
        setError();
        if (!authorizationId) {
          show(loading);
          setError("This authorization request is missing its identifier.");
          return;
        }
        const { data: sessionData } = await supabase.auth.getSession();
        if (!sessionData.session) {
          show(signin);
          return;
        }
        const { data, error } =
          await supabase.auth.oauth.getAuthorizationDetails(authorizationId);
        if (error || !data) {
          show(loading);
          setError(
            error?.message ?? "This authorization request is no longer valid.",
          );
          return;
        }
        if (!("authorization_id" in data)) {
          location.assign(data.redirect_url);
          return;
        }
        document.querySelector("#client-name").textContent =
          data.client?.name ?? "An MCP client";
        const scopes = String(data.scope ?? "")
          .split(/\s+/)
          .filter(Boolean);
        const list = document.querySelector("#scopes");
        list.replaceChildren(
          ...scopes.map((scope) => {
            const item = document.createElement("li");
            item.textContent = scope;
            return item;
          }),
        );
        show(consent);
      }

      async function decide(decision) {
        setError();
        for (const button of document.querySelectorAll("button"))
          button.disabled = true;
        const method =
          decision === "approve" ? "approveAuthorization" : "denyAuthorization";
        const { data, error } =
          await supabase.auth.oauth[method](authorizationId);
        if (error || !data?.redirect_url) {
          for (const button of document.querySelectorAll("button"))
            button.disabled = false;
          setError(
            error?.message ??
              "The authorization decision could not be completed.",
          );
          return;
        }
        location.assign(data.redirect_url);
      }

      document
        .querySelector("#retry")
        .addEventListener("click", loadAuthorization);
      document
        .querySelector("#approve")
        .addEventListener("click", () => decide("approve"));
      document
        .querySelector("#deny")
        .addEventListener("click", () => decide("deny"));
      await loadAuthorization();
    </script>
  </body>
</html>
