<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Review queue</title>
  </head>
  <body>
    <main class="shell" aria-live="polite">
      <header class="header">
        <div>
          <p class="eyebrow">Chumbo</p>
          <h1>Review queue</h1>
        </div>
        <div class="header-actions">
          <button class="refresh" id="expand" type="button" hidden>
            Expand
          </button>
          <button class="refresh" id="refresh" type="button">Refresh</button>
        </div>
      </header>

      <section class="summary" aria-label="Queue summary">
        <span class="pulse" aria-hidden="true"></span>
        <strong id="pending-count">Loading…</strong>
      </section>

      <p class="notice" id="notice" hidden></p>
      <section class="queue" id="queue" data-supa-mcp-scroll></section>
    </main>
    <script type="module" src="./src.ts"></script>
  </body>
</html>
